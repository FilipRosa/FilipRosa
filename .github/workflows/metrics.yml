name: Metrics
on:
  schedule: [{cron: "0 * * * *"}] # beží každú hodinu
  workflow_dispatch: # umožňuje manuálne spustenie

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          filename: metrics.plugin.isocalendar.svg
          plugin_lines: yes
          plugin_isocalendar: yes
          plugin_traffic: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: FilipRosa/dispecing_projekt
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
          plugin_followup: yes
  facts:
      runs-on: ubuntu-latest
      steps:
        - uses: lowlighter/metrics@latest
          with:
            filename: metrics.plugin.habits.facts.svg
            token: ${{ secrets.METRICS_TOKEN }}
            base: ""
            plugin_habits: yes
            plugin_habits_facts: yes
            plugin_habits_charts: yes
            plugin_languages: yes
            plugin_languages_indepth: yes
            config_timezone: Europe/Bratislava

  waka:
      runs-on: ubuntu-latest
      steps:
        - uses: lowlighter/metrics@latest
          with:
            filename: metrics.plugin.wakatime.svg
            token: NOT_NEEDED
            base: ""
            plugin_wakatime: yes
            plugin_wakatime_sections: time, projects, languages, languages-graphs, editors, os, os-graphs
            plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
            plugin_wakatime_days: 365

  anilist:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.anilist.svg
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: FilipUwU
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, watching, reading
          plugin_anilist_limit: 5
